<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>OncoPath Advisory Group | Maintenance</title>
    <style>
      :root {
        color-scheme: dark;
        --navy: #061722;
        --panel: #102433;
        --line: rgba(255, 255, 255, 0.16);
        --text: #f5f1e8;
        --muted: #c8d1d7;
        --accent: #d8b56d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 0%, #173247 0, var(--navy) 48%, #041018 100%);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }
      main {
        width: min(92vw, 720px);
        padding: clamp(28px, 6vw, 56px);
        border: 1px solid var(--line);
        border-radius: 10px;
        background: color-mix(in srgb, var(--panel) 86%, transparent);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }
      .mark {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        margin-bottom: 28px;
        border: 1px solid var(--line);
        border-radius: 50%;
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 7vw, 4.25rem);
        line-height: 1;
        font-weight: 650;
        letter-spacing: 0;
      }
      p {
        margin: 0;
        max-width: 58ch;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.2rem);
      }
      .small {
        margin-top: 28px;
        color: var(--accent);
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="maintenance-title">
      <div class="mark" aria-hidden="true">OP</div>
      <h1 id="maintenance-title">We&rsquo;ll be back soon.</h1>
      <p>OncoPath Advisory Group is temporarily offline while we make updates.</p>
      <p class="small">Please check back later.</p>
    </main>
  </body>
</html>
