<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Partner and Consulting Inquiry | OncoPath Advisory Group</title>
    <meta
      name="description"
      content="Start a sponsor, partner, recruiting, or consulting inquiry with OncoPath Advisory Group."
    />
    <link rel="stylesheet" href="./styles.css?v=20260623-registration" />
    <script src="./form-destinations.js?v=20260623-tracer"></script>
  </head>
  <body>
    <main class="handoff-page">
      <section class="handoff-panel">
        <p class="eyebrow eyebrow--partner">OncoPath inquiry</p>
        <h1>Opening the inquiry form.</h1>
        <p>
          If the form does not open automatically, use the link below for sponsor, partner, recruiting, or consulting
          inquiries.
        </p>
        <a class="button button-partner" href="#" data-handoff-link="inquiry">
          Open Inquiry Form
        </a>
      </section>
    </main>
    <script>
      (function () {
        var destination = window.OncoPathFormDestinations && window.OncoPathFormDestinations.inquiry;
        var link = document.querySelector('[data-handoff-link="inquiry"]');
        if (!destination || !link) return;
        link.href = destination;
        window.setTimeout(function () {
          window.location.href = destination;
        }, 300);
      })();
    </script>
  </body>
</html>
