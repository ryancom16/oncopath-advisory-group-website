<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Event Registration | OncoPath Advisory Group</title>
    <meta
      name="description"
      content="Request a spot for an upcoming OncoPath Advisory Group dinner, workshop, or roundtable."
    />
    <link rel="stylesheet" href="../styles.css?v=20260623-registration" />
    <script src="../form-destinations.js?v=20260831-intake-lanes"></script>
    <script src="../events-data.js?v=20260623-specific-registration"></script>
  </head>
  <body>
    <main class="handoff-page">
      <section class="handoff-panel">
        <p class="eyebrow eyebrow--fellows">OncoPath registration</p>
        <h1 data-registration-title>Opening the registration form.</h1>
        <p data-registration-copy>
          If the form does not open automatically, use the link below to request a spot for an upcoming OncoPath
          Advisory Group event.
        </p>
        <a class="button button-primary" href="#" data-handoff-link="registration">
          Open Registration Form
        </a>
      </section>
    </main>
    <script>
      (function () {
        var destinations = window.OncoPathFormDestinations || {};
        var destination = destinations.registration;
        var link = document.querySelector('[data-handoff-link="registration"]');
        var title = document.querySelector("[data-registration-title]");
        var copy = document.querySelector("[data-registration-copy]");
        if (!destination || !link) return;

        var params = new URLSearchParams(window.location.search);
        var eventKey = params.get("event");
        var events = window.OncoPathEvents || [];
        var selectedEvent = events.find(function (event) {
          return event.id === eventKey || event.title === eventKey;
        });

        if (selectedEvent && destinations.registrationEventEntry) {
          var eventUrl = new URL(destination);
          eventUrl.searchParams.set("usp", "pp_url");
          eventUrl.searchParams.set(destinations.registrationEventEntry, selectedEvent.title);
          destination = eventUrl.toString();
          if (title) title.textContent = "Opening registration for " + selectedEvent.title + ".";
          if (copy) {
            copy.textContent =
              selectedEvent.city +
              " - " +
              selectedEvent.dateTag +
              ". The form will open with this event already selected.";
          }
        }

        link.href = destination;
        window.setTimeout(function () {
          window.location.href = destination;
        }, 300);
      })();
    </script>
  </body>
</html>
