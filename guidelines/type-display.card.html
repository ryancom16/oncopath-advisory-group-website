<!-- @dsCard group="Type" viewport="700x320" name="Display serif — Newsreader" subtitle="Editorial display scale, set tight, weight ~520–540" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--paper); padding: 26px 28px; color: var(--navy-600); }
  .d1 { font: var(--display-1); margin: 0 0 6px; }
  .d2 { font: var(--display-2); margin: 0 0 6px; }
  .d3 { font: var(--display-3); margin: 0 0 6px; }
  .tok { font-family: var(--font-body); font-size: 0.7rem; color: var(--text-muted); display: block; margin-bottom: 18px; }
</style>
</head>
<body>
  <div class="d1">Path to Cure</div>
  <span class="tok">--display-1 · clamp(3.15rem, 8vw, 7.6rem) / 0.95</span>
  <div class="d2">A better room for oncology learning.</div>
  <span class="tok">--display-2 · clamp(2.4rem, 5vw, 4.5rem) / 1.02</span>
  <div class="d3">Three lanes under one advisory group.</div>
  <span class="tok">--display-3 · clamp(1.7rem, 3vw, 2.6rem) / 1.08</span>
</body>
</html>
