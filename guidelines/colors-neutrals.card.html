<!-- @dsCard group="Colors" viewport="700x180" name="Warm neutrals" subtitle="Ivory paper, cream, and cool clinical mist surfaces" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--navy-800); padding: 22px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .sw { width: 124px; }
  .chip { height: 76px; border-radius: var(--radius); border: 1px solid rgba(255,255,255,0.16); }
  .name { font-size: 0.82rem; font-weight: 700; color: #fff; margin-top: 8px; }
  .hex { font-size: 0.72rem; color: rgba(255,255,255,0.6); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--paper)"></div><div class="name">paper</div><div class="hex">#fffdf8</div></div>
    <div class="sw"><div class="chip" style="background:var(--cream)"></div><div class="name">cream</div><div class="hex">#f7f1e7</div></div>
    <div class="sw"><div class="chip" style="background:var(--cream-deep)"></div><div class="name">cream-deep</div><div class="hex">#efe6d6</div></div>
    <div class="sw"><div class="chip" style="background:var(--mist)"></div><div class="name">mist</div><div class="hex">#e7eff0</div></div>
  </div>
</body>
</html>
