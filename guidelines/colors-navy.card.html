<!-- @dsCard group="Colors" viewport="700x180" name="Navy / ink ramp" subtitle="Deep navy anchors heroes, deep sections, and body ink" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--paper); padding: 22px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .sw { width: 124px; }
  .chip { height: 76px; border-radius: var(--radius); border: 1px solid var(--line); }
  .name { font-size: 0.82rem; font-weight: 700; color: var(--navy-600); margin-top: 8px; }
  .hex { font-size: 0.72rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--navy-900)"></div><div class="name">navy-900</div><div class="hex">#061723</div></div>
    <div class="sw"><div class="chip" style="background:var(--navy-800)"></div><div class="name">navy-800</div><div class="hex">#0d2231</div></div>
    <div class="sw"><div class="chip" style="background:var(--navy-700)"></div><div class="name">navy-700</div><div class="hex">#102c3b</div></div>
    <div class="sw"><div class="chip" style="background:var(--navy-600)"></div><div class="name">navy-600 · ink</div><div class="hex">#132b35</div></div>
    <div class="sw"><div class="chip" style="background:var(--navy-500)"></div><div class="name">navy-500</div><div class="hex">#20414e</div></div>
  </div>
</body>
</html>
