<!-- @dsCard group="Type" viewport="700x200" name="Eyebrow & index devices" subtitle="The signature editorial markers — uppercase labels, two-digit indices" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--paper); padding: 26px 28px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
  .eyebrow { font: var(--eyebrow); letter-spacing: var(--eyebrow-tracking); text-transform: uppercase; margin: 0 0 12px; }
  .e-fellows { color: var(--brass-600); }
  .e-residents { color: var(--sage-600); }
  .e-consulting { color: var(--blue-600); }
  .e-partner { color: var(--wine-600); }
  .head { font: var(--display-3); color: var(--navy-600); margin: 0; }
  .idx { font-size: 0.76rem; font-weight: 900; color: var(--wine-600); display: block; margin-bottom: 8px; }
  .tok { font-size: 0.68rem; color: var(--text-muted); margin-top: 14px; }
</style>
</head>
<body>
  <div class="grid">
    <div>
      <p class="eyebrow e-fellows">What To Expect</p>
      <p class="eyebrow e-residents">Program Areas</p>
      <p class="eyebrow e-consulting">Service Lines</p>
      <p class="eyebrow e-partner">Guardrails</p>
      <div class="tok">--eyebrow · uppercase, weight 800, lane-colored</div>
    </div>
    <div>
      <span class="idx">01</span>
      <p class="head">Focused discussion</p>
      <div class="tok">Two-digit index in burgundy · card-grid device</div>
    </div>
  </div>
</body>
</html>
